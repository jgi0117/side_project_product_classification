# COCO 사전학습 탐지 모델 및 MVP 클래스 매핑
drive_folder_url: 'https://drive.google.com/drive/folders/18mUVx75GlJyRX6vUnw4zDWEWwwrPR8Fg?usp=sharing'
raw_dir: 'G:/My Drive/side_project/sample'
model_dir: models/pretrained
output_dir: outputs/rtmdet

classes:
  - computer
  - book

coco_class_mapping:
  computer:
    - laptop
    - tv
  book:
    - book

models:
  - name: rtmdet-tiny
    adapter: rtmdet
    weights: models/pretrained/rtmdet_tiny.pth
    config: rtmdet_tiny_8xb32-300e_coco.py
    python: .model_envs/rtmdet/Scripts/python.exe
    imgsz: 640
  - name: rtmdet-s
    adapter: rtmdet
    weights: models/pretrained/rtmdet_s.pth
    config: rtmdet_s_8xb32-300e_coco.py
    python: .model_envs/rtmdet/Scripts/python.exe
    imgsz: 640
  - name: rtmdet-m
    adapter: rtmdet
    weights: models/pretrained/rtmdet_m.pth
    config: rtmdet_m_8xb32-300e_coco.py
    python: .model_envs/rtmdet/Scripts/python.exe
    imgsz: 640
  - name: rtmdet-l
    adapter: rtmdet
    weights: models/pretrained/rtmdet_l.pth
    config: rtmdet_l_8xb32-300e_coco.py
    python: .model_envs/rtmdet/Scripts/python.exe
    imgsz: 640
  - name: rtmdet-x
    adapter: rtmdet
    weights: models/pretrained/rtmdet_x.pth
    config: rtmdet_x_8xb32-300e_coco.py
    python: .model_envs/rtmdet/Scripts/python.exe
    imgsz: 640

verification_thresholds:
  computer: 0.05
  book: 0.05

# Keep all COCO detections; MVP classes are mapped after inference.
include_other: true
top_k: 1  # Maximum threshold-passing MVP groups; CLI --top-k 2 enables two candidates.
detection_confidence: 0.01
nms_iou: 0.6
other_threshold: 0.05
report_criteria:
  target_accuracy: 0.90
  minimum_accuracy: 0.80
  session_false_accept_rate: 0.05
  session_false_reject_rate: 0.20
seed: 42
device: cpu
speed_warmup: 5
speed_repeats: 3
