# COCO 사전학습 탐지 모델 및 MVP 클래스 매핑
drive_folder_url: 'https://drive.google.com/drive/folders/18mUVx75GlJyRX6vUnw4zDWEWwwrPR8Fg?usp=sharing'
raw_dir: 'G:/My Drive/side_project/sample'
model_dir: models/pretrained
output_dir: outputs/coco_model_suite

classes:
  - computer
  - book

coco_class_mapping:
  computer:
    - laptop
    - tv
  book:
    - book

models:
  - name: yolov8n
    adapter: ultralytics
    weights: yolov8n.pt
    imgsz: 640
  - name: yolov8s
    adapter: ultralytics
    weights: yolov8s.pt
    imgsz: 640
  - name: rtmdet-tiny
    adapter: rtmdet
    weights: models/pretrained/rtmdet_tiny.pth
    python: .model_envs/rtmdet/Scripts/python.exe
    imgsz: 640
  - name: nanodet-plus-m-320
    adapter: nanodet
    weights: models/pretrained/nanodet-plus-m_320.pth
    python: .model_envs/nanodet/Scripts/python.exe
    imgsz: 320
  - name: picodet-s-320
    adapter: picodet
    weights: models/pretrained/picodet_s_320_lcnet_postprocessed.onnx
    imgsz: 320
  - name: yolox-nano
    adapter: yolox
    weights: models/pretrained/yolox_nano.pth
    python: .model_envs/yolox/Scripts/python.exe
    imgsz: 416
  - name: yolox-tiny
    adapter: yolox
    weights: models/pretrained/yolox_tiny.pth
    python: .model_envs/yolox/Scripts/python.exe
    imgsz: 416

verification_thresholds:
  computer: 0.05
  book: 0.05

# Keep all COCO detections; MVP classes are mapped after inference.
include_other: true
top_k: 1  # Maximum threshold-passing MVP groups; CLI --top-k 2 enables two candidates.
detection_confidence: 0.01
nms_iou: 0.6
other_threshold: 0.05
report_criteria:
  target_accuracy: 0.90
  minimum_accuracy: 0.80
  session_false_accept_rate: 0.05
  session_false_reject_rate: 0.20
seed: 42
device: cpu
speed_warmup: 5
speed_repeats: 3
